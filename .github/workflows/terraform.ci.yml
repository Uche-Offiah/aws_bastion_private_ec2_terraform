name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform quality and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize development environment without backend
        run: terraform -chdir=environments/development init -backend=false -lockfile=readonly

      - name: Validate development environment
        run: terraform -chdir=environments/development validate

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
